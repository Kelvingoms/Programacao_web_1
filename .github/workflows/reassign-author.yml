name: Reatribuir commits para Kelvin Gomes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reassign:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Manter o codigo e atualizar a autoria
        shell: bash
        run: |
          git config user.name "Kelvin Gomes"
          git config user.email "Kelvingoms@users.noreply.github.com"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f --env-filter '
          if [ "$GIT_COMMIT" = "e5fff34939ac6b60a036678b5458be35258a1a58" ] || [ "$GIT_COMMIT" = "b0ccff5091eff0dd80b1078519a30270395a011f" ]; then
            export GIT_AUTHOR_NAME="Kelvin Gomes"
            export GIT_AUTHOR_EMAIL="Kelvingoms@users.noreply.github.com"
            export GIT_COMMITTER_NAME="Kelvin Gomes"
            export GIT_COMMITTER_EMAIL="Kelvingoms@users.noreply.github.com"
          fi
          ' -- main
          git push --force origin main
          git rm .github/workflows/reassign-author.yml
          git commit -m "Remover fluxo temporario de reatribuicao"
          git push origin main
